[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-text-triage"
version = "0.1.0"
description = "Classificador NLP leve de laudo para urgência (FIAP Tech Challenge 3)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas==2.3.3",
    "scikit-learn==1.9.0",
    "joblib==1.5.3",
    "fastapi==0.115.14",
    "uvicorn[standard]==0.35.0",
    "prometheus-client==0.22.1",
    "onnx==1.17.0",
    "onnxruntime==1.20.1",
    "skl2onnx==1.18.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "black==24.10.0",
    "flake8==7.1.1",
    "apache-airflow==2.10.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
